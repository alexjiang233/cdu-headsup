<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6e1d2c"><meta name="description" content="成大早知道 761 条公告语义整理全量预览。内容仍在复核中，请以官方原文为准。">
<title>761 条语义整理预览 · 成大早知道</title>
<style>
:root{--ink:#35151b;--wine:#6e1d2c;--wine2:#8b3442;--paper:#f8f3ed;--card:#fffdfa;--line:#e7dcd2;--muted:#876f68;--gold:#d4a66a;--green:#2e6754;--red:#a13b3d;--amber:#96651b;--shadow:0 14px 38px rgba(58,24,27,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.65}.wrap{width:min(1240px,calc(100% - 48px));margin:auto}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:.02em}.mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--wine);border-radius:50%;color:var(--wine);font-family:Georgia,serif;font-size:13px}.topnote{margin-left:auto;color:var(--muted);font-size:12px}.hero{padding:48px 0 24px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}.eyebrow{color:var(--wine2);font-size:11px;letter-spacing:.18em;font-weight:700;text-transform:uppercase}.hero h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(30px,4vw,48px);line-height:1.16;letter-spacing:.02em;margin:10px 0 12px}.hero p{margin:0;color:var(--muted);max-width:720px}.edition{border-left:1px solid var(--line);padding:6px 0 6px 18px;color:var(--muted);font-size:12px;white-space:nowrap}.edition b{display:block;color:var(--wine);font:600 20px Georgia,serif;letter-spacing:.04em}.notice{border:1px solid #e8c9b5;background:#fbede2;padding:14px 18px;margin:4px 0 20px;display:flex;gap:12px;align-items:flex-start;color:#6d3b2e;font-size:13px}.notice strong{color:var(--wine)}.notice-mark{font-family:Georgia,serif;font-size:18px;color:var(--wine)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);margin-bottom:24px}.metric{padding:16px 18px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{font:600 25px Georgia,serif;display:block;margin-top:4px;color:var(--ink)}.metric.is-good b{color:var(--green)}.metric.is-warn b{color:var(--amber)}.metric.is-bad b{color:var(--red)}.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) 210px 140px auto;gap:10px;align-items:center;margin:0 0 14px}.control{height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 13px;border-radius:3px;outline:none}.control:focus{border-color:var(--wine2);box-shadow:0 0 0 3px rgba(110,29,44,.08)}.searchbox{position:relative}.searchbox input{width:100%;padding-left:38px}.searchbox:before{content:"⌕";position:absolute;left:14px;top:3px;font-size:23px;color:var(--muted);pointer-events:none}.seg{display:flex;border:1px solid var(--line);height:44px;background:var(--card);padding:3px}.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}.seg button.active{background:#f1e4dc;color:var(--wine);font-weight:700}.resultline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;padding:6px 2px 12px}.resultline strong{color:var(--wine)}.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.record{background:var(--card);border:1px solid var(--line);padding:17px 18px 15px;transition:border-color .2s,transform .2s}.record:hover{border-color:#cda9a0;transform:translateY(-1px)}.record-head{display:flex;gap:12px;align-items:flex-start}.record-main{min-width:0;flex:1}.record-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;color:var(--muted);font-size:11px}.record h2{font:650 17px/1.4 "PingFang SC","Microsoft YaHei",sans-serif;margin:7px 0 0;letter-spacing:.005em}.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:2px;background:#f0e9e2;color:#765c52;font-size:10px;white-space:nowrap}.state{font-weight:650}.state.reviewed-pass{background:#e3eee8;color:#28624d}.state.reviewed-warnings{background:#f5edda;color:#805d1e}.state.reviewed-unresolved{background:#f6e7d7;color:#92581c}.state.needs-fix{background:#f5e2df;color:#9b3637}.state.unclear{background:#eee8e3;color:#715d55}.state.unreviewed{background:#f0efed;color:#746e69}.record-kicker{margin:12px 0 0;color:#6d5851;font-size:13px;line-height:1.55}.record-kicker b{font-weight:600;color:var(--wine);margin-right:4px}.details{margin-top:12px;border-top:1px solid var(--line);padding-top:9px}.details summary{cursor:pointer;list-style:none;color:var(--wine);font-size:12px;font-weight:650}.details summary::-webkit-details-marker{display:none}.details summary:after{content:"＋";float:right;font-size:16px;line-height:1}.details[open] summary:after{content:"−"}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:8px}.field{padding:9px 0;border-bottom:1px solid #f0e8e1;min-width:0}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.field p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:12px;line-height:1.55}.field.empty p{color:#9d8e87}.field.full{grid-column:1/-1}.record-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:#a08f87;font-size:10px}.source{color:var(--wine2);text-decoration:none;border-bottom:1px solid #d5b2a8;font-size:11px}.source:hover{color:var(--wine)}.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:24px 0 50px}.pager button{height:36px;min-width:38px;border:1px solid var(--line);background:var(--card);color:var(--wine);cursor:pointer;font:inherit}.pager button:disabled{opacity:.4;cursor:not-allowed}.pager .current{font-size:12px;color:var(--muted);padding:0 8px}.footer{border-top:1px solid var(--line);padding:18px 0 30px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:16px}.footer a{color:var(--wine)}.empty-state{grid-column:1/-1;text-align:center;padding:45px 20px;border:1px dashed #d9c9bf;color:var(--muted)}
@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.searchbox{grid-column:1/-1}.seg{grid-column:1/-1}.metrics{grid-template-columns:repeat(3,1fr)}.metric:nth-child(3){border-right:0}.metric:nth-child(n+4){border-top:1px solid var(--line)}}
@media(max-width:620px){.wrap{width:calc(100% - 28px)}.top{height:54px}.hero{padding:34px 0 18px;grid-template-columns:1fr}.hero h1{font-size:32px}.edition{border-left:0;border-top:1px solid var(--line);padding:10px 0 0;display:flex;gap:10px;align-items:center}.edition b{font-size:17px}.notice{padding:12px;font-size:12px}.metrics{grid-template-columns:repeat(2,1fr)}.metric{padding:12px 13px;border-bottom:1px solid var(--line)}.metric:nth-child(2n){border-right:0}.metric:nth-child(3){border-right:1px solid var(--line)}.metric:last-child{grid-column:1/-1;border-bottom:0}.metric b{font-size:22px}.toolbar{grid-template-columns:1fr 1fr;gap:8px}.searchbox{grid-column:1/-1}.control{height:42px;font-size:13px}.seg{grid-column:1/-1}.records{grid-template-columns:1fr;gap:9px}.record{padding:14px}.record h2{font-size:16px}.fieldgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.record-foot{align-items:flex-start}.footer{display:block}.footer span{display:block;margin-top:7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap" style="display:flex;align-items:center;width:min(1240px,calc(100% - 48px))"><a class="brand" href="../"><span class="mark">成</span><span>成大早知道</span></a><span class="topnote">全量语义整理 · 独立预览</span></div></div>
<main class="wrap">
<header class="hero"><div><div class="eyebrow">CDU / NOTICE SEMANTICS</div><h1>761 条公告<br>全量语义预览</h1><p>把公告拆成时间、地点、人群、材料等可检索栏目。这里展示的是待验收数据快照，条目状态会如实标出。</p></div><div class="edition"><b>2026.10.28</b>候选快照</div></header>
<div class="notice"><span class="notice-mark">!</span><div><strong>这是内容验收预览，不是正式公告库。</strong> 多数条目尚未复核；“需修正”“有未决项”以及“未复核”内容均可能有误。另有 2 条带复核提示、31 条复核状态未明确。请以官方原文为准。为保护隐私，联系方式已从预览中移除。</div></div>
<section class="metrics" id="metrics" aria-label="复核状态统计"></section>
<section class="toolbar" aria-label="筛选公告"><div class="searchbox"><input class="control" id="search" type="search" placeholder="搜索标题、栏目内容或公告编号" aria-label="搜索"></div><select class="control" id="status" aria-label="复核状态"><option value="">全部复核状态</option></select><select class="control" id="year" aria-label="年份"><option value="">全部年份</option></select><div class="seg" aria-label="整理范围"><button type="button" data-priority="" class="active">全部 761</button><button type="button" data-priority="0">当前版</button><button type="button" data-priority="1">往期</button></div></section>
<div class="resultline"><span id="count">正在读取数据…</span><span>每页 <strong>24</strong> 条</span></div>
<section class="records" id="records" aria-live="polite"></section>
<nav class="pager" aria-label="分页"><button id="prev">上一页</button><span class="current" id="page"></span><button id="next">下一页</button></nav>
</main>
<footer class="wrap footer"><div>成大早知道 · 公告语义整理试验</div><span>候选快照 2026.10.28 · 不是正式数据库</span><a href="../">返回网站首页</a></footer>
<script>
(()=>{
const fieldOrder=['time','location','audience','eligibility','materials','organizers','level','registration','fees','benefits','notes'];
const stateMeta={
 'reviewed-pass':['已复核 · 通过','reviewed-pass'],
 'reviewed-warnings':['已复核 · 有提示','reviewed-warnings'],
 'reviewed-unresolved':['已复核 · 有未决项','reviewed-unresolved'],
 'needs-fix':['复核结论 · 需修正','needs-fix'],
 'unclear':['复核状态 · 未明确','unclear'],
 'unreviewed':['尚未复核','unreviewed']
};
const statusOrder=['reviewed-pass','reviewed-warnings','reviewed-unresolved','needs-fix','unclear','unreviewed'];
const stateLabels={supported:'已提取',explicitly_none:'原文明示无此项',not_stated_after_full_read:'原文未说明',unresolved_source:'来源未能确认',conflicting:'原文存在冲突',not_applicable:'不适用'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);let db,priority='',page=1;const perPage=24;
function stats(){const c=db.status_counts;const cards=[['全部条目',db.total,''],['复核通过',c['reviewed-pass']||0,'is-good'],['有未决项',c['reviewed-unresolved']||0,'is-warn'],['需修正',c['needs-fix']||0,'is-bad'],['尚未复核',c['unreviewed']||0,'']];$('metrics').innerHTML=cards.map(([a,b,k])=>`<div class="metric ${k}"><span>${a}</span><b>${b}</b></div>`).join('');
const options=Array.from(new Set(db.records.map(r=>r.status))).sort((a,b)=>statusOrder.indexOf(a)-statusOrder.indexOf(b));$('status').innerHTML='<option value="">全部复核状态</option>'+options.map(s=>`<option value="${esc(s)}">${esc(stateMeta[s][0])}</option>`).join('');
Array.from(new Set(db.records.map(r=>r.year).filter(Boolean))).sort((a,b)=>b-a).forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y+' 年';$('year').append(o)});
}
function filtered(){const q=$('search').value.trim().toLowerCase(),st=$('status').value,yr=$('year').value;return db.records.filter(r=>(!priority||String(r.priority)===priority)&&(!st||r.status===st)&&(!yr||String(r.year)===yr)&&(!q||[r.title,r.id,r.edition,...Object.values(r.fields).map(f=>f.value)].join(' ').toLowerCase().includes(q)))}
function card(r,i){const [label,cls]=stateMeta[r.status]||['待复核','unreviewed'];const keyFacts=['time','location','audience'].map(k=>r.fields[k]).filter(f=>f&&f.value&&!['原文未说明','来源未能确认'].includes(f.value)).slice(0,2);const fields=fieldOrder.map((k,j)=>{const f=r.fields[k];if(!f)return '';const empty=['not_stated_after_full_read','unresolved_source','explicitly_none','not_applicable'].includes(f.status);return `<div class="field ${empty?'empty':''} ${k==='notes'?'full':''}"><label>${esc(f.label)} · ${esc(stateLabels[f.status]||'待确认')}</label><p>${esc(f.value)}</p></div>`}).join('');return `<article class="record"><div class="record-head"><div class="record-main"><div class="record-meta"><span>${r.year?esc(r.year)+' 年':'年份未标明'}</span><span class="pill">${r.priority===0?'当前展示通知':'往期同年通知'}</span><span class="pill state ${cls}">${esc(label)}</span></div><h2>${esc(r.title)}</h2></div></div>${keyFacts.map(f=>`<p class="record-kicker"><b>${esc(f.label)}</b>${esc(f.value)}</p>`).join('')}<details class="details"><summary>查看结构化栏目</summary><div class="fieldgrid">${fields}</div></details><div class="record-foot"><span>${esc(r.id)}</span>${r.source?`<a class="source" href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">打开官方原文 ↗</a>`:'<span>未附来源链接</span>'}</div></article>`}
function render(){const items=filtered(),pages=Math.max(1,Math.ceil(items.length/perPage));page=Math.min(page,pages);const from=(page-1)*perPage;$('count').innerHTML=`匹配 <strong>${items.length}</strong> 条 · 第 ${page} / ${pages} 页`;$('records').innerHTML=items.length?items.slice(from,from+perPage).map((r,i)=>card(r,from+i)).join(''):'<div class="empty-state">没有匹配的公告，试试清除筛选条件。</div>';$('page').textContent=`第 ${page} / ${pages} 页`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;}
fetch('./records.json').then(r=>{if(!r.ok)throw Error('读取数据失败');return r.json()}).then(d=>{db=d;stats();render()}).catch(()=>{$('count').textContent='预览数据暂时无法加载';$('records').innerHTML='<div class="empty-state">页面与数据文件未能连接，请刷新后重试。</div>'});
['search','status','year'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{page=1;render()}));document.querySelectorAll('[data-priority]').forEach(b=>b.addEventListener('click',()=>{priority=b.dataset.priority;document.querySelectorAll('[data-priority]').forEach(x=>x.classList.toggle('active',x===b));page=1;render()}));$('prev').addEventListener('click',()=>{page--;render();window.scrollTo({top:0,behavior:'smooth'})});$('next').addEventListener('click',()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})});
})();
</script>
</body></html>
